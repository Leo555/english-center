<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD166" />
      <stop offset="1" stop-color="#FF7A45" />
    </linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7B84B" />
      <stop offset="1" stop-color="#E8801E" />
    </linearGradient>
  </defs>

  <!-- badge background -->
  <circle cx="100" cy="100" r="96" fill="url(#bg)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="4" />

  <!-- lion mane petals -->
  <g>
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(0 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(30 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(60 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(90 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(120 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(150 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(180 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(210 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(240 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(270 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(300 100 100)" />
    <ellipse cx="100" cy="38" rx="15" ry="25" fill="url(#mane)" transform="rotate(330 100 100)" />
  </g>

  <!-- ears -->
  <circle cx="66" cy="70" r="15" fill="url(#mane)" />
  <circle cx="134" cy="70" r="15" fill="url(#mane)" />
  <circle cx="66" cy="72" r="7" fill="#FFDCB0" />
  <circle cx="134" cy="72" r="7" fill="#FFDCB0" />

  <!-- face -->
  <circle cx="100" cy="107" r="50" fill="#FFF6E0" stroke="#E8801E" stroke-width="3" />

  <!-- blush -->
  <circle cx="70" cy="122" r="9" fill="#FF9E80" opacity="0.55" />
  <circle cx="130" cy="122" r="9" fill="#FF9E80" opacity="0.55" />

  <!-- whiskers -->
  <g stroke="#E0AA6A" stroke-width="2.5" stroke-linecap="round">
    <line x1="40" y1="108" x2="62" y2="104" />
    <line x1="40" y1="118" x2="63" y2="118" />
    <line x1="42" y1="128" x2="64" y2="131" />
    <line x1="160" y1="108" x2="138" y2="104" />
    <line x1="160" y1="118" x2="137" y2="118" />
    <line x1="158" y1="128" x2="136" y2="131" />
  </g>

  <!-- eyes -->
  <circle cx="83" cy="100" r="6" fill="#3B2A1A" />
  <circle cx="117" cy="100" r="6" fill="#3B2A1A" />
  <circle cx="85" cy="98" r="2" fill="#FFFFFF" />
  <circle cx="119" cy="98" r="2" fill="#FFFFFF" />

  <!-- nose -->
  <path d="M93,114 Q100,107 107,114 Q100,122 93,114 Z" fill="#E8801E" />

  <!-- smile -->
  <path d="M84,124 Q100,138 116,124" fill="none" stroke="#C1631E" stroke-width="4" stroke-linecap="round" />

  <!-- sparkle stars -->
  <g fill="#FFFFFF">
    <path d="M158 46 l4 9 l9 4 l-9 4 l-4 9 l-4-9 l-9-4 l9-4 z" />
    <path d="M36 56 l3 6 l6 3 l-6 3 l-3 6 l-3-6 l-6-3 l6-3 z" />
  </g>
</svg>
